<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>ChemFinder - Register</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <!-- Styles & auth are injected as part of the main bundle via webpack -->
  </head>
  <body
    class="bg-background-light dark:bg-background-dark font-display text-slate-800 dark:text-slate-200"
  >
    <div class="min-h-screen flex items-center justify-center px-4">
      <div
        class="max-w-md w-full bg-white dark:bg-slate-900 rounded-xl shadow-lg p-8"
      >
        <h2
          class="text-2xl font-bold text-slate-900 dark:text-white text-center"
        >
          Daftar
        </h2>
        <p class="mt-2 text-center text-sm text-slate-600 dark:text-slate-400">
          Buat akun untuk melanjutkan
        </p>
        <form id="registerForm" class="mt-6 space-y-4">
          <div>
            <label
              for="registerName"
              class="block text-sm text-slate-700 dark:text-slate-300"
              >Nama Lengkap</label
            >
            <input
              id="registerName"
              name="name"
              type="text"
              required
              class="mt-1 block w-full rounded border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark px-4 py-3 focus:ring-primary focus:border-primary"
            />
          </div>
          <div>
            <label
              for="registerEmail"
              class="block text-sm text-slate-700 dark:text-slate-300"
              >Email</label
            >
            <input
              id="registerEmail"
              name="email"
              type="email"
              required
              class="mt-1 block w-full rounded border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark px-4 py-3 focus:ring-primary focus:border-primary"
            />
          </div>
          <div>
            <label
              for="registerUsername"
              class="block text-sm text-slate-700 dark:text-slate-300"
              >Username</label
            >
            <input
              id="registerUsername"
              name="username"
              type="text"
              required
              minlength="3"
              maxlength="32"
              class="mt-1 block w-full rounded border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark px-4 py-3 focus:ring-primary focus:border-primary"
            />
          </div>
          <div>
            <label
              for="registerPassword"
              class="block text-sm text-slate-700 dark:text-slate-300"
              >Password</label
            >
            <input
              id="registerPassword"
              name="password"
              type="password"
              required
              minlength="6"
              class="mt-1 block w-full rounded border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark px-4 py-3 focus:ring-primary focus:border-primary"
            />
          </div>
          <div>
            <label
              for="registerConfirm"
              class="block text-sm text-slate-700 dark:text-slate-300"
              >Konfirmasi Password</label
            >
            <input
              id="registerConfirm"
              name="confirm"
              type="password"
              required
              class="mt-1 block w-full rounded border-slate-300 dark:border-slate-700 bg-background-light dark:bg-background-dark px-4 py-3 focus:ring-primary focus:border-primary"
            />
          </div>
          <div class="flex items-center justify-between">
            <a href="./login.html" class="text-sm text-primary hover:underline"
              >Sudah punya akun? Masuk</a
            >
            <button
              type="submit"
              class="px-4 py-2 bg-primary text-white rounded-lg font-bold"
            >
              Daftar
            </button>
          </div>
          <div
            id="registerMessage"
            class="text-sm text-center mt-2"
            aria-live="polite"
          ></div>
        </form>
      </div>
    </div>
  </body>
</html>
